name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          minecraft=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"

      - name: Check tag
        if: github.ref_type == 'tag'
        run: test "${{ github.ref_name }}" = "v${{ steps.version.outputs.version }}"

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Checkout Maven branch
        run: |
          if git ls-remote --exit-code --heads origin maven > /dev/null; then
            git fetch origin maven
            git worktree add -B maven ../maven-branch origin/maven
          else
            git worktree add --detach ../maven-branch
            git -C ../maven-branch checkout --orphan maven
            git -C ../maven-branch rm -rf --quiet .
          fi
          mkdir -p build/repo
          cp -R ../maven-branch/. build/repo/
          rm -rf build/repo/.git

      - name: Build and publish
        run: ./gradlew build publish

      - name: Write release notes
        run: |
          if [ "${{ steps.version.outputs.version }}" = "0.1" ]; then
            echo "Initial release of Arkea 0.1 Alpha for Minecraft 26.3 on NeoForge." > build/release-notes.md
          else
            notes=$(awk -v version="${{ steps.version.outputs.version }}" '$0 == "## " version || index($0, "## [" version "]") == 1 {found = 1; next} found && /^## / {exit} found {print}' docs/CHANGELOG.md)
            if [ -z "$notes" ]; then
              notes=$(awk '$0 == "## Unreleased" {found = 1; next} found && /^## / {exit} found {print}' docs/CHANGELOG.md)
            fi
            printf '%s\n' "$notes" > build/release-notes.md
          fi

      - name: Update Maven branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -R build/repo/. ../maven-branch/
          cd ../maven-branch
          git add -A
          if git diff --cached --quiet; then
            echo "Maven branch is up to date"
          else
            git commit -m "Publish Arkea ${{ steps.version.outputs.version }}"
            git push origin maven
          fi

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Arkea ${{ steps.version.outputs.version }}
          body_path: build/release-notes.md
          files: build/libs/*.jar

      - name: Publish to Modrinth and CurseForge
        if: github.ref_type == 'tag' && (env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != '')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'arkea' }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID || '1733983' }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: build/libs/arkea-neoforge-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}.jar
          name: Arkea ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: alpha
          changelog-file: build/release-notes.md
          loaders: neoforge
          game-versions: ${{ steps.version.outputs.minecraft }}
          java: 25

      - name: Update Modrinth description
        if: env.MODRINTH_TOKEN != ''
        run: |
          node -e "
          const fs = require('fs');
          let body = fs.readFileSync('README.md', 'utf8');
          body = body.replace(/branding\/logo\.png/g, 'https://raw.githubusercontent.com/arystonmc/Arkea/main/branding/logo.png');
          body = body.replace(/docs\/FEATURES\.md/g, 'https://github.com/arystonmc/Arkea/blob/main/docs/FEATURES.md');
          body = body.replace(/docs\/API\.md/g, 'https://github.com/arystonmc/Arkea/blob/main/docs/API.md');
          body = body.replace(/SUPPORT\.md/g, 'https://github.com/arystonmc/Arkea/blob/main/SUPPORT.md');
          body = body.replace(/CONTRIBUTING\.md/g, 'https://github.com/arystonmc/Arkea/blob/main/CONTRIBUTING.md');
          body = body.replace(/LICENSE\.md/g, 'https://github.com/arystonmc/Arkea/blob/main/LICENSE.md');
          body = body.replace(/THIRD_PARTY_NOTICES\.md/g, 'https://github.com/arystonmc/Arkea/blob/main/THIRD_PARTY_NOTICES.md');

          const data = JSON.stringify({ body });
          const https = require('https');
          const req = https.request('https://api.modrinth.com/v2/project/${{ vars.MODRINTH_ID || 'arkea' }}', {
            method: 'PATCH',
            headers: {
              'Authorization': process.env.MODRINTH_TOKEN,
              'Content-Type': 'application/json',
              'User-Agent': 'arystonmc/Arkea'
            }
          }, (res) => {
            console.log('Modrinth description status:', res.statusCode);
            res.pipe(process.stdout);
          });
          req.write(data);
          req.end();
          "
