plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

java {
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    jarJar(implementation("org.jcodec:jcodec")) {
        version {
            strictly "[${jcodec_version},0.3)"
            prefer jcodec_version
        }
    }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named("test", Test) {
    useJUnitPlatform()
    testLogging {
        events "skipped", "failed"
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            programArguments.addAll '--graphicsBackend', 'vulkan'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_url                : mod_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources) {
    from('branding') {
        include 'logo.png'
        rename 'logo.png', "${mod_id}.png"
    }
    from('.') {
        include 'COPYING', 'COPYING.LESSER', 'THIRD_PARTY_NOTICES.md'
    }
}

tasks.named('sourcesJar', Jar) {
    from('.') {
        include 'COPYING', 'COPYING.LESSER'
    }
}

publishing {
    publications {
        register('mod', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
            pom {
                name = mod_name
                description = 'Client-side interface library for Minecraft mods with animated, consistent settings screens.'
                url = mod_url
                licenses {
                    license {
                        name = mod_license
                        url = "https://www.gnu.org/licenses/lgpl-3.0.html"
                    }
                }
                scm {
                    url = mod_url
                }
            }
        }
    }
    repositories {
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('repo')
        }
        if (providers.environmentVariable('GITHUB_TOKEN').isPresent()) {
            maven {
                name = 'GitHubPackages'
                url = uri("https://maven.pkg.github.com/${providers.environmentVariable('GITHUB_REPOSITORY').getOrElse('lureidcom/Arkea')}")
                credentials {
                    username = providers.environmentVariable('GITHUB_ACTOR').getOrElse('')
                    password = providers.environmentVariable('GITHUB_TOKEN').get()
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
